services:
  legal-bot:
    build:
      context: .
      dockerfile: Dockerfile
    shm_size: "3gb"
    container_name: advertisment-bot
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./app/database/data:/app/app/database/data
    ports:
      - "${WEBHOOK_PORT}:${WEBHOOK_PORT}"

